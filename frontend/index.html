<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->
  <header>
    <nav class="navbar bg-dark ">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-white">Expense Tracker</span>
        <button class="btn btn-outline-light" id="darkModeButton">Dark Mode</button>
      </div>
    </nav>
  </header>

  <main class="py-4">
    <div class="container">
      <div class="summaryContainer">
        <div>
          <div class="card">
            <div class="card-body text-center">
              <h5 class="card-title">Total Amount</h5>
              <p class="card-text" id="total">$0</p>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-body text-center">
              <h5 class="card-title">Number Of Expenses</h5>
              <p class="card-text" id="numberOfExpenses">0</p>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-body text-center">
              <h5 class="card-title">Highest Expense</h5>
              <p class="card-text" id="highestExpense">$0</p>
            </div>
          </div>
        </div>
      </div>

      <div id="loadingSpinner" class="text-center my-4" >
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading</span>
        </div>
      </div>

      <div class="mt-4 bg-white p-3 border rounded" id="addExpenseContainer">
        <h4>Add Expense</h4>
        <div id="alertContainer"></div>
        <form id="expenseForm">

          <div class="row">
            <div class="col-md-4">
              <div class="mb-3">
                <label for="title">Title</label>
                <input type="text" class="form-control" id="title" placeholder="Enter title" required>
              </div>
            </div>

            <div class="col-md-2">
              <div class="mb-3">
                <label for="amount">Amount</label>
                <input type="number" class="form-control" id="amount" placeholder="Enter amount" required min="0.01" step="any">
              </div>
            </div>

            <div class="col-md-3">
              <div class="mb-3">
                <label for="category">Category</label>
                <select class="form-select" id="category" required>
                 <option selected disabled value="">Choose...</option>
                 <option value="Food">Food</option>
                 <option value="Transport">Transport</option>
                 <option value="Bills">Bills</option>
                 <option value="Entertainment">Entertainment</option>
                 <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div class="col-md-3">
              <div class="mb-3">
                <label for="date">Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Add expense</button>

        </form>
      </div>

      <div class="mt-4 bg-white p-3 border rounded" id="expensesContainer">
        <div class="d-flex justify-content-between align-items-center">
        <h4>Expenses</h4>

        
        <input type="text" class="form-control mx-3" style="width: 50%;" id="titleSearch" placeholder="Search by title">

        <div class="d-flex align-items-center gap-2">
          <label for="categoryFilter" class="filterLable">Filter by:</label>
        <select class="form-select w-auto" id="categoryFilter">
                 <option value="All">All</option>
                 <option value="Food">Food</option>
                 <option value="Transport">Transport</option>
                 <option value="Bills">Bills</option>
                 <option value="Entertainment">Entertainment</option>
                 <option value="Other">Other</option>
        </select>
      </div>
      </div>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="expenseTableBody">

          </tbody>
        </table>
      </div>

    </div>

  </main>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="editTitle">Title</label>
            <input type="text" class="form-control" id="editTitle" placeholder="Enter title" required>
          </div>

          <div class="mb-3">
            <label for="editAmount">Amount</label>
            <input type="number" class="form-control" id="editAmount" placeholder="Enter amount" required min="0.01" step="any">
          </div>

          <div class="mb-3">
            <label for="editCategory">Category</label>
            <select class="form-select" id="editCategory" required>
                 <option value="Food">Food</option>
                 <option value="Transport">Transport</option>
                 <option value="Bills">Bills</option>
                 <option value="Entertainment">Entertainment</option>
                 <option value="Other">Other</option>
             </select>
          </div>

          <div class="mb-3">
            <label for="editDate">Date</label>
            <input type="date" class="form-control" id="editDate" placeholder="Enter date" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveEditButton">Save Changes</button>
        </div>

      </div>
    </div>
  </div>

  <div id="floatingAlertContainer">
    
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
